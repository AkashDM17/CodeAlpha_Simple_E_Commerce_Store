<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShopEasy</title>
  <meta name="description" content="Create a new customer account on ShopEasy to save your cart, track orders, and checkout quickly.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="nav-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </div>
        <span>ShopEasy</span>
      </a>

      <!-- Navigation Links -->
      <ul class="nav-links" id="nav-links">
        <li class="nav-item"><a href="index.html">Home</a></li>
        <li class="nav-item"><a href="products.html">Products</a></li>
        <li class="nav-item">
          <a href="cart.html" class="cart-link">
            <span>Cart</span>
            <span class="cart-badge">0</span>
          </a>
        </li>
      </ul>

      <!-- Auth Action Container -->
      <div class="nav-auth" id="nav-auth-container">
        <a href="login.html" class="btn btn-sm btn-secondary">Login</a>
        <a href="register.html" class="btn btn-sm btn-primary active">Register</a>
      </div>

      <!-- Mobile Menu Button -->
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open navigation menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </header>

  <!-- Register Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Join ShopEasy to start shopping today</p>
      </div>

      <div id="register-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="register-name">Full Name *</label>
          <input type="text" id="register-name" class="form-control" placeholder="e.g. Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email Address *</label>
          <input type="email" id="register-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password (Minimum 6 Characters) *</label>
          <input type="password" id="register-password" class="form-control" placeholder="Create a password" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-confirm-password">Confirm Password *</label>
          <input type="password" id="register-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-submit-btn" style="margin-top: 1rem;">
          Register Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding: 0;">
      <p>&copy; 2026 ShopEasy Inc. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
